name: Build & release configs

# Tangle the literate org configs into ready-to-use files and attach them to a
# GitHub Release, so people who don't use Emacs can just download and drop them
# in. The generated files are never committed to the repo.

on:
  push:
    tags:
      - "v*"          # push a tag like v1.0 to cut a release
  workflow_dispatch:   # or run it by hand from the Actions tab
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v1.0)"
        required: true
        default: "latest"

permissions:
  contents: write      # needed to create the release and upload assets

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox

      - name: Tangle & package
        run: |
          chmod +x bin/tangle-release.sh
          bin/tangle-release.sh "$GITHUB_WORKSPACE/dist"

      - name: Resolve tag
        id: tag
        run: echo "value=${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: ${{ steps.tag.outputs.value }}
          fail_on_unmatched_files: true
          body: |
            Prebuilt configs tangled from the literate org sources — no Emacs required.

            **Quickshell pill** (`quickshell-pill.tar.gz`)
            ```sh
            tar -xzf quickshell-pill.tar.gz -C ~/.config/quickshell/   # -> ~/.config/quickshell/pill/
            ```

            **Doom config** (`doom-config.tar.gz`)
            ```sh
            tar -xzf doom-config.tar.gz -C ~/.config/doom/             # config.el / init.el / packages.el
            ```
          files: |
            dist/quickshell-pill.tar.gz
            dist/doom-config.tar.gz
