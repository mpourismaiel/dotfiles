# shelf.conf — options for scripts/shelf (media library + Actions dropdown + click-to-pause)
# Override at runtime with --script-opts=shelf-<key>=<value>.

# Comma separated library roots. Each root is one section; every subfolder
# (up to `depth` levels) becomes its own section titled by the folder name.
dirs=~/Videos
# How many subfolder levels to descend below each root (0 = root only)
depth=2
# Sort files inside a section: mtime (newest first) or name
sort=mtime
# Show the library automatically when mpv is idle (no file loaded)
show_on_idle=yes
# Reopen the library when the playlist reaches its end (needs keep-open=yes)
show_on_eof=yes
# Card width in pixels (thumbnail is 16:9 inside it); everything scales with it
card_width=236
# Overall UI scale multiplier (on top of display-hidpi-scale)
scale=1
# Thumbnail frame position as a fraction of the file duration
thumb_position=0.2
# Max concurrent ffmpeg thumbnail jobs
jobs=3
# Where thumbnails are cached (mpv path expansion: ~~cache/ = ~/.cache/mpv/)
cache_dir=~~cache/shelf
# File types listed in the library
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,dsf,dts,flac,m4a,mka,mp3,mp4a,oga,ogg,opus,wav,weba,wma,wv
image_types=avif,bmp,gif,jpeg,jpg,jxl,png,tif,tiff,webp
# Pixels from the top edge within which the Actions bar reveals itself during playback
top_reveal=120
# Single left click on the video toggles pause (drags and double clicks are ignored).
# Off by default: right click pauses (stock mpv), left click stays free.
click_to_pause=no
# Presses longer than this many milliseconds are not clicks
click_threshold=250
# Where the UI state (collapsed folders, "one folder at a time") is persisted
state_file=~~state/shelf.json
