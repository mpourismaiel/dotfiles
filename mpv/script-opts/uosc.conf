# uosc.conf — amber-deck theme for uosc 5.x (colours/fonts mirror quickshell/pill Theme.qml)
# Full option reference: https://github.com/tomasklaen/uosc/blob/main/src/uosc.conf

# ---- timeline ----------------------------------------------------------------
timeline_style=line
timeline_line_width=3
timeline_size=36
timeline_persistency=paused,audio
timeline_border=1
timeline_step=5
timeline_cache=yes
progress=windowed
progress_size=2
progress_line_width=20

# ---- controls bar (buttons for everything that matters to the mouse) ---------
controls=menu,gap,command:video_library:script-binding shelf/toggle-library?Library (Tab),command:folder_open:script-binding uosc/open-file?Open file (Ctrl+O),gap,subtitles,<has_many_audio>audio,<has_many_video>video,<has_many_edition>editions,<has_chapter>chapters,<stream>stream-quality,gap,space,speed,space,shuffle,loop-playlist,loop-file,gap,prev,command:list_alt:script-binding shelf/playlist#playlist-count>1?Playlist (Ctrl+P),next,gap,command:photo_camera:screenshot?Screenshot (S),fullscreen
controls_size=32
controls_margin=8
controls_spacing=2
controls_persistency=paused,audio

# ---- volume ------------------------------------------------------------------
volume=right
volume_size=40
volume_border=1
volume_step=1
volume_persistency=

# ---- speed slider ------------------------------------------------------------
speed_step=0.1
speed_step_is_factor=no
speed_persistency=

# ---- menus -------------------------------------------------------------------
menu_item_height=34
menu_min_width=280
menu_padding=6
menu_type_to_search=yes

# ---- top bar: shelf draws the ☰ Actions button + title on the left; uosc keeps
#      the window controls on the right. ----------------------------------------
top_bar=never
top_bar_size=44
top_bar_controls=yes
top_bar_title=no
top_bar_alt_title=
top_bar_alt_title_place=below
top_bar_flash_on=
top_bar_persistency=

window_border_size=1

autoload=no
autoload_types=video,audio,image
shuffle=no

# ---- look --------------------------------------------------------------------
scale=1
scale_fullscreen=1.2
font_scale=1
text_border=1.2
border_radius=8
# foreground = gold (sliders, active buttons), background = clay surfaces
color=foreground=d9a441,foreground_text=1b1712,background=1b1712,background_text=efe9dd,curtain=0f0c09,success=a5e075,error=cf4636
opacity=timeline=0.92,position=1,chapters=0.8,slider=0.9,slider_gauge=1,controls=0,speed=0.6,menu=0.98,submenu=0.4,border=1,title=1,tooltip=1,thumbnail=1,curtain=0.75,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8
refine=
animation_duration=120
# left clicks are owned by scripts/shelf (click-to-pause lives there); 0 keeps uosc from grabbing them
click_threshold=0
click_command=cycle pause; script-binding uosc/flash-pause-indicator
flash_duration=1000
proximity_in=40
proximity_out=120
font_bold=no
destination_time=playtime-remaining
time_precision=0
buffered_time_threshold=60
autohide=no
pause_indicator=flash
stream_quality_options=4320,2160,1440,1080,720,480,360,240,144
video_types=3g2,3gp,asf,avi,f4v,flv,h264,h265,m2ts,m4v,mkv,mov,mp4,mp4v,mpeg,mpg,ogm,ogv,rm,rmvb,ts,vob,webm,wmv,y4m
audio_types=aac,ac3,aiff,ape,au,cue,dsf,dts,flac,m4a,mid,midi,mka,mp3,mp4a,oga,ogg,opus,spx,tak,tta,wav,weba,wma,wv
image_types=apng,avif,bmp,gif,j2k,jp2,jfif,jpeg,jpg,jxl,mj2,png,svg,tga,tif,tiff,webp
subtitle_types=aqt,ass,gsub,idx,jss,lrc,mks,pgs,pjs,psb,rt,sbv,slt,smi,sub,sup,srt,ssa,ssf,ttxt,txt,usf,vt,vtt
default_directory=~/Videos
show_hidden_files=no
use_trash=no
adjust_osd_margins=yes
chapter_ranges=openings:30abf964,endings:30abf964,ads:c54e4e80
chapter_range_patterns=openings:オープニング;endings:エンディング
languages=slang,en
# the shelf library replaces the "drop files" idle screen
disable_elements=idle_indicator,top_bar
