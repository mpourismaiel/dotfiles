# input.conf — mpv keybindings
#
# Every binding ends with `#! Section > Item`. Two things read those comments:
#   - uosc's menu (bottom-left ≡ button, right-click, `menu` key)
#   - the shelf Actions dropdown (top-left ☰ button, F1)
# so the mouse can trigger anything a key can. Lines whose key is `#` are
# menu-only entries (uosc convention); shelf shows the key of `keypress X`
# entries as the hint so script-owned keys still display their shortcut.
# `---` as an item name draws a separator.

# ---- mouse -------------------------------------------------------------------
# (right click = play/pause as in stock mpv; left click is free for uosc/shelf buttons)
MBTN_LEFT_DBL   cycle fullscreen
MBTN_RIGHT      cycle pause
MBTN_MID        script-binding shelf/toggle-library
MBTN_BACK       playlist-prev
MBTN_FORWARD    playlist-next
WHEEL_UP        add volume 2
WHEEL_DOWN      add volume -2
WHEEL_LEFT      seek -5
WHEEL_RIGHT     seek 5

# ---- library / menus ---------------------------------------------------------
TAB             script-binding shelf/toggle-library             #! Library
F1              script-binding shelf/toggle-actions             #! Actions menu
menu            script-binding uosc/menu                        #! Quick menu
Ctrl+o          script-binding uosc/open-file                   #! Open > File…
#               keypress ctrl+v                                 #! Open > Paste URL from clipboard
Ctrl+Shift+o    script-binding uosc/load-subtitles              #! Open > Load subtitles…
Ctrl+d          script-binding uosc/download-subtitles          #! Open > Download subtitles…

# ---- playback ----------------------------------------------------------------
SPACE           cycle pause                                     #! Playback > Play / Pause
p               cycle pause                                     #! Playback > Play / Pause
.               frame-step                                      #! Playback > Next frame
,               frame-back-step                                 #! Playback > Previous frame
#               ignore                                          #! Playback > ---
]               multiply speed 1.1                              #! Playback > Speed +10%
[               multiply speed 1/1.1                            #! Playback > Speed −10%
}               multiply speed 2.0                              #! Playback > Speed ×2
{               multiply speed 0.5                              #! Playback > Speed ÷2
0               set speed 1.0                                   #! Playback > Reset speed
BS              set speed 1.0                                   #! Playback > Reset speed
#               ignore                                          #! Playback > ---
l               ab-loop                                         #! Playback > Set A-B loop point
L               cycle-values loop-file inf no                   #! Playback > Loop file
Ctrl+l          cycle-values loop-playlist inf no               #! Playback > Loop playlist
#               ignore                                          #! Playback > ---
Shift+BS        revert-seek                                     #! Playback > Undo last seek
Shift+Ctrl+BS   revert-seek mark                                #! Playback > Mark position for undo
#               keypress ctrl+z                                 #! Playback > Undo (UndoRedo)
#               keypress ctrl+y                                 #! Playback > Redo (UndoRedo)

# ---- seek --------------------------------------------------------------------
RIGHT           seek 5                                          #! Seek > Forward 5s
LEFT            seek -5                                         #! Seek > Back 5s
Ctrl+RIGHT      seek 10                                         #! Seek > Forward 10s
Ctrl+LEFT       seek -10                                        #! Seek > Back 10s
Shift+RIGHT     seek 1 exact                                    #! Seek > Forward 1s (exact)
Shift+LEFT      seek -1 exact                                   #! Seek > Back 1s (exact)
Shift+PGUP      seek 600                                        #! Seek > Forward 10 min
Shift+PGDWN     seek -600                                       #! Seek > Back 10 min
#               ignore                                          #! Seek > ---
PGUP            add chapter 1                                   #! Seek > Next chapter
PGDWN           add chapter -1                                  #! Seek > Previous chapter
Ctrl+c          script-binding uosc/chapters                    #! Seek > Chapters…
#               ignore                                          #! Seek > ---
>               playlist-next                                   #! Seek > Next file
ENTER           playlist-next                                   #! Seek > Next file
<               playlist-prev                                   #! Seek > Previous file
Ctrl+p          script-binding shelf/playlist                   #! Seek > Playlist (grid)

# ---- audio -------------------------------------------------------------------
UP              add volume 2                                    #! Audio > Volume up
DOWN            add volume -2                                   #! Audio > Volume down
m               cycle mute                                      #! Audio > Mute
#               ignore                                          #! Audio > ---
SHARP           cycle audio                                     #! Audio > Next audio track
Ctrl+a          script-binding uosc/audio                       #! Audio > Audio tracks…
Ctrl+Shift+a    script-binding uosc/audio-device                #! Audio > Audio device…
#               ignore                                          #! Audio > ---
Ctrl++          add audio-delay 0.100                           #! Audio > Delay +100 ms
Ctrl+-          add audio-delay -0.100                          #! Audio > Delay −100 ms
Ctrl+=          set audio-delay 0                               #! Audio > Reset delay

# ---- subtitles ---------------------------------------------------------------
v               cycle sub-visibility                            #! Subtitles > Show / hide
j               cycle sub                                       #! Subtitles > Next subtitle track
J               cycle sub down                                  #! Subtitles > Previous subtitle track
Ctrl+s          script-binding uosc/subtitles                   #! Subtitles > Subtitle tracks…
Alt+v           cycle secondary-sub-visibility                  #! Subtitles > Secondary subtitles
#               ignore                                          #! Subtitles > ---
z               add sub-delay -0.1                              #! Subtitles > Earlier 100 ms
Z               add sub-delay +0.1                              #! Subtitles > Later 100 ms
x               add sub-delay +0.1                              #! Subtitles > Later 100 ms
Alt+z           set sub-delay 0                                 #! Subtitles > Reset delay
#               ignore                                          #! Subtitles > ---
Ctrl+UP         add sub-pos -1                                  #! Subtitles > Move up
Ctrl+DOWN       add sub-pos +1                                  #! Subtitles > Move down
Shift+g         add sub-scale +0.1                              #! Subtitles > Bigger
Shift+f         add sub-scale -0.1                              #! Subtitles > Smaller
u               cycle-values sub-ass-override force no          #! Subtitles > Toggle ASS style override

# ---- video -------------------------------------------------------------------
_               cycle video                                     #! Video > Next video track
E               cycle edition                                   #! Video > Next edition
d               cycle deinterlace                               #! Video > Deinterlace
Ctrl+h          cycle-values hwdec auto-safe no                 #! Video > Hardware decoding
A               cycle-values video-aspect-override 16:9 4:3 2.35:1 -1 #! Video > Cycle aspect ratio
#               ignore                                          #! Video > ---
Alt++           add video-zoom 0.1                              #! Video > Zoom in
Alt+-           add video-zoom -0.1                             #! Video > Zoom out
Alt+LEFT        add video-pan-x 0.1                             #! Video > Pan left
Alt+RIGHT       add video-pan-x -0.1                            #! Video > Pan right
Alt+UP          add video-pan-y 0.1                             #! Video > Pan up
Alt+DOWN        add video-pan-y -0.1                            #! Video > Pan down
Alt+BS          set video-zoom 0 ; set video-pan-x 0 ; set video-pan-y 0 #! Video > Reset zoom and pan
w               add panscan -0.1                                #! Video > Panscan −
W               add panscan +0.1                                #! Video > Panscan +
#               ignore                                          #! Video > ---
1               add contrast -1                                 #! Video > Contrast −
2               add contrast 1                                  #! Video > Contrast +
3               add brightness -1                               #! Video > Brightness −
4               add brightness 1                                #! Video > Brightness +
5               add gamma -1                                    #! Video > Gamma −
6               add gamma 1                                     #! Video > Gamma +
7               add saturation -1                               #! Video > Saturation −
8               add saturation 1                                #! Video > Saturation +
Ctrl+0          set contrast 0 ; set brightness 0 ; set gamma 0 ; set saturation 0 #! Video > Reset colour

# ---- window ------------------------------------------------------------------
f               cycle fullscreen                                #! Window > Fullscreen
ESC             set fullscreen no                               #! Window > Leave fullscreen
T               cycle ontop                                     #! Window > Always on top
#               cycle border                                    #! Window > Window border
#               ignore                                          #! Window > ---
Alt+0           set current-window-scale 0.5                    #! Window > Half size
Alt+1           set current-window-scale 1.0                    #! Window > Normal size
Alt+2           set current-window-scale 2.0                    #! Window > Double size
#               ignore                                          #! Window > ---
q               quit                                            #! Window > Quit
Q               quit-watch-later                                #! Window > Quit and remember position

# ---- screenshots -------------------------------------------------------------
s               screenshot                                      #! Screenshot > With subtitles
S               screenshot video                                #! Screenshot > Video only
Ctrl+Shift+s    screenshot window                               #! Screenshot > Window (with UI)
Alt+s           screenshot each-frame                           #! Screenshot > Every frame (toggle)

# ---- history / bookmarks (SimpleHistory, SimpleBookmark, delete-marker) -------
#               keypress h                                      #! History > Show history
#               keypress r                                      #! History > Recent files
#               keypress ctrl+r                                 #! History > Resume last position
#               keypress alt+r                                  #! History > Load last played
#               keypress ctrl+H                                 #! History > Incognito mode
#               ignore                                          #! History > ---
#               keypress ctrl+b                                 #! History > Bookmark (with time)
#               keypress alt+b                                  #! History > Bookmark (file only)
#               keypress b                                      #! History > Show bookmarks
#               ignore                                          #! History > ---
#               keypress ctrl+shift+d                           #! History > Mark file for deletion
#               keypress ctrl+shift+x                           #! History > Delete marked files
#               keypress ctrl+shift+c                           #! History > Unmark all

# ---- tools -------------------------------------------------------------------
i               script-binding stats/display-stats              #! Tools > Stats (hold)
I               script-binding stats/display-stats-toggle       #! Tools > Stats (toggle)
`               script-binding console/enable                   #! Tools > Console
O               no-osd cycle-values osd-level 3 1               #! Tools > OSD always on
o               show-progress                                   #! Tools > Show progress
F8              show-text ${playlist}                           #! Tools > Show playlist
F9              show-text ${track-list}                         #! Tools > Show track list
F5              script-binding shelf/rescan                     #! Tools > Rescan library
