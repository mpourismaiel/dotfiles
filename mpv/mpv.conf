# mpv.conf — amber-deck mpv (matches the quickshell pill's Terminal 79 theme)
#
# UI is drawn by two scripts:
#   scripts/uosc/        — timeline, controls bar, menus (script-opts/uosc.conf)
#   scripts/shelf/       — media library grid on idle + top-left Actions dropdown
#                          (script-opts/shelf.conf; dirs default to ~/Videos)
# Keys are in input.conf; every binding carries a `#! Section > Item` comment
# which both uosc's menu and the shelf Actions dropdown read.

# ---- window ------------------------------------------------------------------
idle=yes                      # launching bare `mpv` opens the library window
force-window=yes
keep-open=yes                 # stay on last frame (shelf reopens the library at eof)
border=no                     # uosc draws its own window controls
keepaspect-window=no
autofit=1280x800              # initial window size (idle library + videos fit in this box)
autofit-larger=90%x90%
cursor-autohide=1200
cursor-autohide-fs-only=no

# ---- video / audio -----------------------------------------------------------
vo=gpu-next
hwdec=auto-safe
volume=100
volume-max=150
audio-file-auto=fuzzy
sub-auto=fuzzy
slang=en,eng
alang=en,eng

# ---- osd / subtitles (fonts shared with the pill) ----------------------------
osc=no
osd-bar=no
osd-font=IBM Plex Sans
osd-font-size=30
osd-color='#efe9dd'
osd-border-size=1.5
osd-border-color='#1b1712'
sub-font=IBM Plex Sans
sub-font-size=42
sub-color='#efe9dd'
sub-border-size=2
sub-border-color='#1b1712'
sub-shadow-offset=1
sub-shadow-color='#80000000'
sub-margin-y=48

# ---- screenshots -------------------------------------------------------------
screenshot-format=png
screenshot-png-compression=6
screenshot-directory=~/Pictures/mpv
screenshot-template='%F_%P'
