# source-rnnoise.conf — RNNoise mic filter for the pill's voice recording.
# Run as: pipewire -c ~/.config/quickshell/pill/source-rnnoise.conf
# (spawned by the pill only while recording with noise suppression enabled)
context.properties = {
    log.level = 0
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "RNNoise (pill transcribe)"
            media.name       = "RNNoise (pill transcribe)"
            filter.graph = {
                nodes = [
                    {
                        type   = ladspa
                        name   = rnnoise
                        plugin = /usr/lib/ladspa/librnnoise_ladspa.so
                        label  = noise_suppressor_mono
                        control = { "VAD Threshold (%)" = 50.0 }
                    }
                ]
            }
            capture.props = {
                node.name    = "capture.rnnoise_source"
                node.passive = true
                audio.rate   = 48000
            }
            playback.props = {
                node.name    = "rnnoise_source"
                media.class  = Audio/Source
                audio.rate   = 48000
            }
        }
    }
]
